[project]
name = "protect-transcriber"
version = "0.1.0"
description = "Select a time range from a UniFi Protect camera and transcribe its audio with self-hosted Whisper instances."
requires-python = ">=3.11"
license = { text = "MIT" }
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `pytest` works the same as `python -m pytest`
# (the latter adds the cwd itself) without needing an editable install.
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM"]
ignore = [
  "B008",     # FastAPI Depends()/File() in argument defaults is idiomatic
  "ASYNC240", # local mkdir/stat/exists on the data volume; cheap enough to inline
]
