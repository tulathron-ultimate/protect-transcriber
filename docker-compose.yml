services:
  protect-transcriber:
    # The published image; nothing to build. Swap `latest` for a version tag to pin.
    image: ghcr.io/tulathron-ultimate/protect-transcriber:latest
    # To run your own changes instead, uncomment this and use `docker compose up --build`.
    # build: .
    container_name: protect-transcriber
    restart: unless-stopped
    ports:
      - "8099:8099"
    env_file:
      - .env
    volumes:
      # On Unraid this is typically /mnt/user/appdata/protect-transcriber
      - ./data:/data
    # Whisper containers are usually on the same host; if they are on this
    # Docker network instead, reference them by service name in WHISPER_INSTANCES.
    extra_hosts:
      - "host.docker.internal:host-gateway"
