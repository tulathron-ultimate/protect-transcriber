name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The media tests exercise real extraction and chunking.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: protect-transcriber:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name pt -p 8099:8099 \
            -e 'WHISPER_INSTANCES=a=http://127.0.0.1:9|asr_webservice' \
            protect-transcriber:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8099/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8099/ | grep -q 'Protect Transcriber'
          docker logs pt
          docker rm -f pt
